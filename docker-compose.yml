services:
  app:
    build: .
    image: drohnen-trainingsbegleiter
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    volumes:
      # Persistente SQLite-Datenbank (DATABASE_PATH=./data/app.db, cwd = /app).
      - ./data:/app/data

  # ── PocketID (OIDC-Provider für Admin-Login) ───────────────────────────────
  # PocketID wird als externer/separater Dienst betrieben. Das folgende Beispiel
  # zeigt eine mögliche lokale Variante. In Produktion läuft PocketID i. d. R.
  # auf einer eigenen Domain hinter HTTPS. Setze danach im .env: OIDC_ISSUER,
  # OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, OIDC_REDIRECT_URI passend.
  #
  # pocket-id:
  #   image: ghcr.io/pocket-id/pocket-id:latest
  #   restart: unless-stopped
  #   ports:
  #     - "1411:1411"
  #   env_file:
  #     - .env.pocket-id
  #   volumes:
  #     - ./pocket-id-data:/app/data
